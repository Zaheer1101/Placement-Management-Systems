{% extends 'admin/admin_base.html' %}

{% block admin_content %}
<div class="container py-4">
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">
            <h4><i class="fas fa-trash-alt me-2"></i>Confirm Delete Student</h4>
        </div>
        <div class="card-body">
            <p>Are you sure you want to delete <strong>{{ student.user.get_full_name }}</strong> ({{ student.user.email }})?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a href="{% url 'core:manage_students' %}" class="btn btn-secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
