{% extends 'admin/admin_base.html' %}
{% block admin_content %}
<div class="container mt-4">
    <h2>Edit Company: {{ company.name }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-6">
                <h5>Basic Info</h5>
                {{ user_form.as_p }}
            </div>
            <div class="col-md-6">
                <h5>Company Profile</h5>
                {{ profile_form.as_p }}
            </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Save Changes</button>
        <a href="{% url 'core:manage_companies' %}" class="btn btn-secondary mt-3">Cancel</a>
    </form>
</div>
{% endblock %}
